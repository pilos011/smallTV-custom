[platformio]
src_dir = src
data_dir = data

[env:sdpro-clock-weather]
; bootsafe.cpp carries its own setup()/loop() and belongs only to the
; sdpro-bootsafe environment; without this it links into this one too.
build_src_filter = +<*> -<bootsafe.cpp>
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.ldscript = eagle.flash.4m2m.ld
board_build.filesystem = littlefs
; 160 MHz: the analog face is CPU bound on compositing, measured at ~250 ms/frame at 80 MHz
board_build.f_cpu = 160000000L
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.4
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
    -DVTABLES_IN_FLASH
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=-1
    -DTFT_DC=0
    -DTFT_RST=2
    -DTFT_BL=5
    -DTOUCH_CS=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000

[env:sdpro-bootsafe]
; A firmware whose only job is to be reachable, built for the STOCK layout.
;
; 4m3m, not 4m2m: the stock firmware puts its filesystem at 3 MB, and matching
; it is what makes the stock filesystem mountable - which is the only way to
; read the weather icons in /ico off a device whose web UI has no download
; route. It also has to be small: the stock firmware is 488 KB and leaves about
; 547 KB of OTA staging room, which the 872 KB full build does not fit into.
;
; main.cpp and the display sources are excluded; this environment builds one
; file and links nothing it does not need.
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.ldscript = eagle.flash.4m3m.ld
board_build.filesystem = littlefs
board_build.f_cpu = 160000000L
build_src_filter = -<*> +<bootsafe.cpp>
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
    -DVTABLES_IN_FLASH
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=-1
    -DTFT_DC=0
    -DTFT_RST=2
    -DTFT_BL=5
    -DTOUCH_CS=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DSPI_FREQUENCY=40000000

[env:sdpro-clock-weather-4m3m]
; The full firmware on the STOCK layout, so the icons and fonts recovered from
; the factory filesystem stay where they are and stay readable. Same sources as
; sdpro-clock-weather; only the partition table differs - 3 MB of filesystem
; instead of 2, which also means far less room to stage an OTA.
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.ldscript = eagle.flash.4m3m.ld
board_build.filesystem = littlefs
board_build.f_cpu = 160000000L
build_src_filter = +<*> -<bootsafe.cpp>
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.4
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
    -DVTABLES_IN_FLASH
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=-1
    -DTFT_DC=0
    -DTFT_RST=2
    -DTFT_BL=5
    -DTOUCH_CS=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000

[env:sdpro-bootsafe-4m2m]
; The same bootsafe firmware on OUR layout. Needed as a stepping stone: an OTA
; is staged below the filesystem, so while a 4m3m image is running the ceiling
; is 682 KB and the 872 KB main firmware cannot be sent. Landing this first
; moves the filesystem to 2 MB, which lifts the ceiling to 1.7 MB.
extends = env:sdpro-bootsafe
board_build.ldscript = eagle.flash.4m2m.ld
