<!DOCTYPE html>
<html>
<head>
<title>Photo Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<link rel="stylesheet" type="text/css" href="style.css">
<style>
    /* ... 保持您的 CSS 样式不变 ... */
    /* ... 为了节省篇幅，这里省略 CSS 部分，请保留您原有的 CSS ... */
    
    /* 进度条 */
    .storage-info { display: flex; justify-content: space-between; color: var(--sub-text); font-size: 13px; margin-bottom: 8px; }
    .progress-track { background-color: #2c2c2e; height: 8px; border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background-color: var(--success-color); width: 0%; transition: width 0.5s ease; }
    .file-list { list-style: none; padding: 0; margin: 0; }
    .file-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--border-color); }
    .file-item:last-child { border-bottom: none; }
    .file-info { display: flex; align-items: center; flex: 1; }
    .play-checkbox { width: 22px; height: 22px; margin-right: 12px; accent-color: var(--success-color); cursor: pointer; }
    .file-details { display: flex; flex-direction: column; }
    .file-name { font-size: 16px; color: var(--text-color); font-weight: 500; }
    .file-size { font-size: 12px; color: var(--sub-text); margin-top: 4px; }
    .btn-delete { width: auto; padding: 8px 16px; margin-top: 0; background-color: rgba(255, 69, 58, 0.2); color: var(--danger-color); font-size: 14px; }
    .btn-secondary { background-color: #3a3a3c; color: var(--text-color); }
    #preview-area { display: none; margin-top: 15px; text-align: center; border-top: 1px solid var(--border-color); padding-top: 15px; }
    canvas { border-radius: 8px; border: 1px solid var(--border-color); max-width: 100%; margin-bottom: 10px; }
    #gif-preview { display: none; max-width: 240px; max-height: 240px; border: 1px solid var(--border-color); border-radius: 8px; margin: 0 auto 10px auto; }
    .status-text { text-align: center; font-size: 13px; color: var(--primary-color); margin-top: 10px; min-height: 20px; }
</style>
</head>
<body>

<div class="app-container">
    <h1>Photo Manager</h1>

    <div style="padding: 0 16px;">
        <a href="/"><button type="button" class="btn-secondary">‹ Back to Clock</button></a>
    </div>

    <h2>Storage (/photo)</h2>
    <div class="led-settings">
        <div class="storage-info">
            <span id="storage-text">Checking...</span>
            <span id="storage-free"></span>
        </div>
        <div class="progress-track">
            <div id="storage-bar" class="progress-fill"></div>
        </div>
    </div>

    <h2>Add Photo</h2>
    <div class="led-settings">
        <input type="file" id="uploadInput" accept="image/png, image/jpeg, image/gif" onchange="previewImage()" style="display: none;">
        
        <button type="button" onclick="document.getElementById('uploadInput').click()">
            Select Photo
        </button>
        <div class="helper-text" style="text-align: center;">
            JPG/PNG: Auto-crop to 240x240<br>
            GIF: Max 240x240 (Check Size)
        </div>

        <div id="preview-area">
            <div style="color: var(--sub-text); margin-bottom: 10px; font-size: 14px;">Preview</div>
            <canvas id="canvas" width="240" height="240" style="display:none;"></canvas>
            <img id="gif-preview" src="" alt="GIF Preview">
            
            <div style="display: flex; gap: 10px;">
                <button type="button" class="btn-secondary" onclick="cancelUpload()">Cancel</button>
                <button type="button" id="btn-upload" onclick="processAndUpload()" style="background-color: var(--success-color);">Upload</button>
            </div>
            <div id="upload-status" class="status-text"></div>
        </div>
    </div>

    <h2>Current Files</h2>
    <div class="led-settings">
        <div style="margin-bottom: 10px; font-size: 12px; color: var(--sub-text);">
            Check box to include in slideshow
        </div>
        <ul id="fileList" class="file-list">
            <li class="file-item" style="justify-content: center; color: var(--sub-text);">Loading...</li>
        </ul>
        <button type="button" class="btn-secondary" onclick="loadFiles()" style="margin-top: 15px;">Refresh List</button>
        
        <p>Switch Interval</p>
        <select id="intervalList" onchange="updateInterval(this.value)">
            <option value="5">5 Seconds</option>
            <option value="10">10 Seconds</option>
            <option value="15">15 Seconds</option>
            <option value="30">30 Seconds</option>
            <option value="60">1 Minute</option>
            <option value="180">3 Minutes</option>
            <option value="300">5 Minutes</option>
        </select>
    </div>

</div>

<script>
    let currentFreeSpace = 0;
    const TARGET_SIZE = 240;
    let currentFileIsGif = false;
    let currentOriginalFile = null; 

    document.addEventListener('DOMContentLoaded', loadFiles);

    // ============================
    // 1. 文件列表 & 轮播开关逻辑
    // ============================
    function loadFiles() {
        fetch('/photo/list')
            .then(res => res.json())
            .then(data => {
                updateStorageUI(data.total, data.used);
                updateFileList(data.files);
                
                // === 【核心修改】读取后端返回的 interval 并更新下拉菜单 ===
                if (data.interval) {
                    const select = document.getElementById('intervalList');
                    // 确保返回的值在选项列表中，否则保持默认
                    // 注意：C++发来的是数字，value是字符串，JS会自动转换比较
                    select.value = data.interval; 
                    console.log("Loaded interval: " + data.interval + "s");
                }
            })
            .catch(() => {
                document.getElementById('fileList').innerHTML = '<li class="file-item" style="color:var(--danger-color)">Connection Lost</li>';
            });
    }

    function updateFileList(files) {
        const list = document.getElementById('fileList');
        list.innerHTML = '';
        if (!files || files.length === 0) {
            list.innerHTML = '<li class="file-item" style="justify-content: center; color: var(--sub-text);">No photos found</li>';
            return;
        }
        files.forEach(f => {
            const li = document.createElement('li');
            li.className = 'file-item';
            const isChecked = (f.enabled !== false) ? 'checked' : '';
            li.innerHTML = `
                <div class="file-info">
                    <input type="checkbox" class="play-checkbox" ${isChecked} 
                           onchange="togglePhoto('${f.name}', this.checked)">
                    <div class="file-details">
                        <span class="file-name">${f.name}</span>
                        <span class="file-size">${formatSize(f.size)}</span>
                    </div>
                </div>
                <button class="btn-delete" onclick="deletePhoto('${f.name}')">Delete</button>
            `;
            list.appendChild(li);
        });
    }

    function togglePhoto(name, isChecked) {
        const state = isChecked ? 1 : 0;
        fetch(`/photo/toggle?name=${encodeURIComponent(name)}&state=${state}`)
            .then(res => { if(!res.ok) console.log("Toggle failed"); })
            .catch(err => console.error(err));
    }

    function deletePhoto(name) {
        if(confirm(`Delete "${name}"?`)) {
            fetch('/photo/delete?name=' + encodeURIComponent(name))
                .then(res => { if(res.ok) loadFiles(); else alert("Delete failed"); });
        }
    }

    // ============================
    // 2. 图片预览 (GIF & Canvas)
    // ============================
    function previewImage() {
        const input = document.getElementById('uploadInput');
        const file = input.files[0];
        if (!file) return;

        currentOriginalFile = file;
        const previewArea = document.getElementById('preview-area');
        const status = document.getElementById('upload-status');
        const uploadBtn = document.getElementById('btn-upload');

        previewArea.style.display = 'block';
        status.innerText = "Analyzing...";
        uploadBtn.disabled = true;

        if (file.type === 'image/gif') {
            currentFileIsGif = true;
            processGifPreview(file);
        } else {
            currentFileIsGif = false;
            processCanvasPreview(file);
        }
    }

    function processGifPreview(file) {
        const gifImg = document.getElementById('gif-preview');
        const canvas = document.getElementById('canvas');
        const status = document.getElementById('upload-status');
        const uploadBtn = document.getElementById('btn-upload');

        const reader = new FileReader();
        reader.onload = function(e) {
            const tempImg = new Image();
            tempImg.onload = function() {
                if (this.width > 240 || this.height > 240) {
                    status.innerText = `Error: GIF size ${this.width}x${this.height} > 240x240`;
                    status.style.color = "var(--danger-color)";
                    gifImg.style.display = 'none';
                    return;
                }
                if (file.size > currentFreeSpace) {
                     status.innerText = `Error: File too large (${formatSize(file.size)})`;
                     status.style.color = "var(--danger-color)";
                     gifImg.style.display = 'none';
                     return;
                }
                gifImg.src = e.target.result;
                gifImg.style.display = 'block';
                canvas.style.display = 'none';
                status.innerText = `GIF Ready (${this.width}x${this.height})`;
                status.style.color = "var(--primary-color)";
                uploadBtn.disabled = false;
            };
            tempImg.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function processCanvasPreview(file) {
        const gifImg = document.getElementById('gif-preview');
        const canvas = document.getElementById('canvas');
        const status = document.getElementById('upload-status');
        const uploadBtn = document.getElementById('btn-upload');

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const ctx = canvas.getContext("2d");
                const w = img.width; const h = img.height;
                let sx, sy, sSize;
                if (w > h) { sSize = h; sx = (w - h) / 2; sy = 0; } 
                else { sSize = w; sx = 0; sy = (h - w) / 2; }
                
                ctx.clearRect(0, 0, TARGET_SIZE, TARGET_SIZE);
                ctx.fillStyle = "#000000";
                ctx.fillRect(0, 0, TARGET_SIZE, TARGET_SIZE);
                ctx.drawImage(img, sx, sy, sSize, sSize, 0, 0, TARGET_SIZE, TARGET_SIZE);
                
                canvas.style.display = 'block';
                gifImg.style.display = 'none';
                status.innerText = "Ready (Auto-crop to 240x240)";
                status.style.color = "var(--primary-color)";
                uploadBtn.disabled = false;
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function cancelUpload() {
        document.getElementById('uploadInput').value = '';
        document.getElementById('preview-area').style.display = 'none';
        document.getElementById('upload-status').innerText = "";
        document.getElementById('gif-preview').src = "";
        currentOriginalFile = null;
    }

    function processAndUpload() {
        const status = document.getElementById('upload-status');
        if (currentFileIsGif) {
            const file = currentOriginalFile;
            if (file.size > currentFreeSpace) { alert("Storage Full!"); return; }
            const finalName = generateSafeName(file.name, ".gif");
            uploadData(file, finalName);
        } else {
            const canvas = document.getElementById('canvas');
            status.innerText = "Compressing...";
            canvas.toBlob(function(blob) {
                if (!blob) return;
                if (blob.size > currentFreeSpace) { alert("Storage Full!"); return; }
                const finalName = generateSafeName(currentOriginalFile.name, ".jpg");
                uploadData(blob, finalName);
            }, "image/jpeg", 0.8);
        }
    }

    function generateSafeName(originalName, extension) {
        let baseName = originalName.substring(0, originalName.lastIndexOf('.')) || originalName;
        baseName = baseName.replace(/[^a-zA-Z0-9_\-]/g, "");
        if (baseName.length === 0) baseName = "image";
        if (baseName.length > 20) baseName = baseName.substring(0, 20);
        return baseName + extension;
    }

    function uploadData(blobOrFile, filename) {
        const status = document.getElementById('upload-status');
        status.innerText = "Uploading...";
        const formData = new FormData();
        formData.append("file", blobOrFile, filename);
        fetch('/photo/upload', { method: 'POST', body: formData })
        .then(res => {
            if (res.ok) { alert("Upload Successful!"); cancelUpload(); loadFiles(); } 
            else { status.innerText = "Error: " + res.status; }
        })
        .catch(err => status.innerText = "Network Error");
    }

    function updateStorageUI(total, used) {
        currentFreeSpace = total - used;
        const percent = Math.round((used / total) * 100);
        const bar = document.getElementById('storage-bar');
        bar.style.width = percent + '%';
        bar.style.backgroundColor = (percent > 90) ? 'var(--danger-color)' : 'var(--success-color)';
        document.getElementById('storage-text').innerText = `${formatSize(used)} / ${formatSize(total)}`;
        document.getElementById('storage-free').innerText = `Free: ${formatSize(currentFreeSpace)}`;
    }

    function formatSize(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const s = ['B', 'KB', 'MB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + s[i];
    }

    function updateInterval(seconds) {
        fetch('/photo/interval?val=' + seconds)
            .then(res => {
                if (res.ok) console.log("Interval set to " + seconds + "s");
                else alert("Failed to set interval");
            })
            .catch(err => console.error(err));
    }
</script>
</body>
</html>
